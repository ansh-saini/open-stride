<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenStride App Store slide</title>
<!-- Renders one 1290x2796 App Store screenshot. Pick the slide with ?n=1..6. -->
<style>
  :root { --bg: #15110e; --accent: #ff7a2f; --text: #fff7f0; --muted: #c9b8aa; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1290px; height: 2796px; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: var(--text);
    background:
      radial-gradient(1100px 900px at 50% 1500px, rgba(255,122,47,0.42), transparent 70%),
      radial-gradient(700px 500px at 100% 0, rgba(255,122,47,0.18), transparent 70%),
      var(--bg);
    position: relative;
  }
  body.light {
    --bg: #ff7a2f; --text: #1b120b; --muted: #4a2c18; --accent: #fff7f0;
    background: linear-gradient(160deg, #ffa25c 0%, #ff7a2f 45%, #f0582a 100%);
  }
  .copy { position: absolute; top: 170px; left: 0; right: 0; text-align: center; padding: 0 90px; }
  .eyebrow { font-size: 40px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 30px; }
  h1 { font-size: 104px; line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: var(--accent); }
  p.sub { font-size: 46px; line-height: 1.3; color: var(--muted); margin-top: 34px; font-weight: 500; }
  .phone {
    position: absolute; left: 50%; top: 860px; transform: translateX(-50%);
    width: 1010px; padding: 26px; border-radius: 150px; background: #050403;
    box-shadow: 0 0 0 6px #2b2522, 0 60px 120px rgba(0,0,0,0.45);
  }
  .screen { position: relative; border-radius: 124px; overflow: hidden; background: #000; }
  .status {
    height: 115px; display: flex; align-items: center; justify-content: space-between; padding: 22px 82px 0 92px;
    font-size: 44px; font-weight: 600; color: #fff; background: #000;
  }
  .island { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 300px; height: 88px; border-radius: 44px; background: #000; }
  .icons { display: flex; gap: 16px; align-items: center; }
  .screen img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="copy">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="phone">
  <div class="screen">
    <div class="island"></div>
    <div class="status">
      <span>9:41</span>
      <span class="icons">
        <svg width="52" height="32" viewBox="0 0 52 32" fill="#fff"><rect x="0" y="22" width="9" height="10" rx="2"/><rect x="14" y="15" width="9" height="17" rx="2"/><rect x="28" y="8" width="9" height="24" rx="2"/><rect x="42" y="0" width="9" height="32" rx="2"/></svg>
        <svg width="46" height="34" viewBox="0 0 46 34" fill="#fff"><path d="M23 6c7 0 13 3 18 7l4-4C39 3 31 0 23 0S7 3 1 9l4 4c5-4 11-7 18-7z"/><path d="M23 17c4 0 8 2 11 4l4-4c-4-4-9-6-15-6S12 13 8 17l4 4c3-2 7-4 11-4z"/><circle cx="23" cy="29" r="5"/></svg>
        <svg width="78" height="36" viewBox="0 0 78 36"><rect x="1.5" y="1.5" width="66" height="33" rx="10" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="3"/><rect x="7" y="7" width="55" height="22" rx="5" fill="#fff"/><rect x="71" y="12" width="5" height="12" rx="2.5" fill="#fff" fill-opacity="0.45"/></svg>
      </span>
    </div>
    <img id="shot" alt="">
  </div>
</div>
<script>
  const slides = {
    1: ["Your plan", "A coach that reads<br><em>your body</em>", "Plans built from your Apple Health runs, heart rate and paces.", false],
    2: ["Smart load", "It notices when<br>you <em>overdo it</em>", "Doubled your mileage? The coach cuts back before you get hurt.", true],
    3: ["Every session", "Your paces. <em>Your zones.</em>", "Pace and heart rate targets from your own runs.", false],
    4: ["Insights", "Zones built from<br><em>your heart</em>", "Heart rate and pace zones, fitness score and race predictions.", true],
    5: ["Transparent", "See exactly<br><em>why</em> it decided", "Every number the coach saw and every change it made.", false],
    6: ["Private", "Runs on <em>your iPhone</em>", "Gemma 3 works on-device and offline. Your health data stays on your phone.", true],
  };
  const n = Number(new URLSearchParams(location.search).get("n") || 1);
  const [eyebrow, title, sub, light] = slides[n];
  document.getElementById("eyebrow").textContent = eyebrow;
  document.getElementById("title").innerHTML = title;
  document.getElementById("sub").textContent = sub;
  document.getElementById("shot").src = `screens/s${n}.png`;
  if (light) document.body.classList.add("light");
</script>
</body>
</html>
