name: OpenStride
options:
  bundleIdPrefix: com.anshsaini
  deploymentTarget:
    iOS: "17.0"
packages:
  CoachKit:
    path: ../CoachKit
  CoachMLX:
    path: ../CoachMLX
targets:
  OpenStride:
    type: application
    platform: iOS
    sources: [OpenStride]
    dependencies:
      - package: CoachKit
      - package: CoachMLX
      - sdk: HealthKit.framework
    entitlements:
      path: OpenStride/OpenStride.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: OpenStride/Info.plist
      properties:
        CFBundleDisplayName: OpenStride
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: OpenStride reads your runs, heart rate, resting heart rate and VO2 max to build a training plan for you. Your data stays on this iPhone.
        NSHealthUpdateUsageDescription: OpenStride does not write to Apple Health.
        NSLocalNetworkUsageDescription: Optional. Connect to an Ollama server on your network instead of the on-device model.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshsaini.openstride
        DEVELOPMENT_TEAM: 4Z85JP96PU
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  OpenStrideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OpenStrideUITests]
    dependencies:
      - target: OpenStride
    settings:
      base:
        DEVELOPMENT_TEAM: 4Z85JP96PU
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenStride:
    build:
      targets:
        OpenStride: all
    test:
      targets:
        - OpenStrideUITests
